name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          MPLCONFIGDIR: /tmp/matplotlib
        run: python -m pytest

      - name: Model metadata smoke test
        run: python -c "import json; data=json.load(open('model/metadata.json', encoding='utf-8')); assert data['primary_metric']=='f1_macro'"
